PLG_SYSTEM_ADMINEXILE="System - AdminExile"
PLG_SYSTEM_ADMINEXILE_XML_DESCRIPTION="AdminExile is a Joomla! plugin that helps you secure your administrator backend."
PLG_SYSTEM_ADMINEXILE_KEYSPACER_LABEL="Configure /administrator Key(s)"
PLG_SYSTEM_ADMINEXILE_KEY_LABEL="Key"
PLG_SYSTEM_ADMINEXILE_KEY_DESC="Enter a key to secure your /administrator URL. This key will be appended to the URL as a query string (https://domain/administrator/?querystring). There are several characters which are not allowed (the form will show an error if you try to use one of these characters), and your key may NOT be entirely numeric."
PLG_SYSTEM_ADMINEXILE_KEYVALUE_LABEL="Key Value"
PLG_SYSTEM_ADMINEXILE_KEYVALUE_DESC="Enter a value for the key you entered above. If present (not empty) this value will be appended to the URL as the value of your key query string (https://domain/administrator/?querystring=value)."
PLG_SYSTEM_ADMINEXILE_KEYUSAGE_LABEL="Bookmark your /administrator URL"
COM_PLUGINS_ACTIONS_FIELDSET_LABEL="Actions"
PLG_SYSTEM_ADMINEXILE_LOGOUTACTION_LABEL="Logout Action"
PLG_SYSTEM_ADMINEXILE_GRACEPERIOD_LABEL="Re-entry Grace Period"
PLG_SYSTEM_ADMINEXILE_GRACEPERIOD_DESC="Upon logging out, the user will be allowed to log back in within this time period without having to re-enter the key. The default value is 0, but this will cause a single Failed Login Action (below). To prevent the failed login action upon logout, set this value to at least 1."
PLG_SYSTEM_ADMINEXILE_FAILACTION_LABEL="Failed Login Action"
PLG_SYSTEM_ADMINEXILE_FAILLOG_LABEL="Log Failed Attempts"
PLG_SYSTEM_ADMINEXILE_FAILLOG_DESC="<p>Log failed login attempts to the error_log. Useful for debugging and automating firewall bans.</p><ul><li>Auth Errors are logged as: AdminExile: Failed keyauth: x.x.x.x</li><li>Tor Denials are logged as: AdminExile: TOR: x.x.x.x</li></ul>"
PLG_SYSTEM_ADMINEXILE_REDIRECT_LABEL="Redirect"
PLG_SYSTEM_ADMINEXILE_REDIRECT_DESC="Redirect the user to a different URL when a failed login attempt is made. This can be a custom URL or one of the built-in options."
PLG_SYSTEM_ADMINEXILE_REDIRECT_HOME="Homepage"
PLG_SYSTEM_ADMINEXILE_REDIRECT_404="404 Page Not Found"
PLG_SYSTEM_ADMINEXILE_REDIRECT_URL="Custom URL"
PLG_SYSTEM_ADMINEXILE_FOUROFOUR_LABEL="404 Page Not Found"
PLG_SYSTEM_ADMINEXILE_FOUROFOUR_DESC="Use the textarea to customize your 404 page to match your server's error page. {url} will be replaced with the URL that was requested."
PLG_SYSTEM_ADMINEXILE_REDIRECTURL_LABEL="Custom URL"
PLG_SYSTEM_ADMINEXILE_REDIRECTURL_DESC="Enter the URL you want to redirect to when a failed login attempt is made."
COM_PLUGINS_IPSECURITY_FIELDSET_LABEL="IP Security"
PLG_SYSTEM_ADMINEXILE_ENABLEIP_LABEL="Enable IP Security"
PLG_SYSTEM_ADMINEXILE_ENABLEIP_DESC="Enable IP Security to restrict access to your /administrator backend to only those IP addresses you specify."
PLG_SYSTEM_ADMINEXILE_IPSECURITY_SPACER="IP Security Configuration"
PLG_SYSTEM_ADMINEXILE_WHITELIST_LABEL="Whitelist"
PLG_SYSTEM_ADMINEXILE_WHITELIST_DESC="Enter the IP addresses that you want to allow access to your /administrator backend. Separate multiple IP addresses with a comma."
PLG_SYSTEM_ADMINEXILE_BLACKLIST_LABEL="Blacklist"
PLG_SYSTEM_ADMINEXILE_BLACKLIST_DESC="Enter the IP addresses that you want to block from accessing your /administrator backend. Separate multiple IP addresses with a comma."
PLG_SYSTEM_ADMINEXILE_ADDRESS_LABEL="IP Address"
PLG_SYSTEM_ADMINEXILE_ADDRESS_DESC="Enter the IPv4 or IPv6 address you want to add to the whitelist or blacklist."
PLG_SYSTEM_ADMINEXILE_NETMASK_LABEL="CIDR Netmask"
PLG_SYSTEM_ADMINEXILE_NETMASK_DESC="Enter the CIDR netmask for the IP address you entered above. This is the number of bits in the IP address that are fixed. For example, if you enter 24, the first 24 bits of the IP address will be fixed and the remaining 8 bits will be variable."
PLG_SYSTEM_ADMINEXILE_NOTE_LABEL="Note"
PLG_SYSTEM_ADMINEXILE_NOTE_DESC="Enter a note to help you remember why you added this IP address to the whitelist or blacklist."
PLG_SYSTEM_ADMINEXILE_TORNODES_SPACER="Tor Nodes"
PLG_SYSTEM_ADMINEXILE_TORNODES_SPACER_DESC="<p>If you have the <a href='https://www.richeyweb.com/software/joomla/plugins/console-tor-nodes' target='_blank'>Console - Tor Nodes</a> plugin installed, you can use it to block access to your /administrator backend from Tor nodes. This is useful for preventing brute force attacks from Tor nodes.</p><p>If you do not have Console - Tor Nodes installed, this setting will do nothing.</p>"
PLG_SYSTEM_ADMINEXILE_TORNODES_LABEL="Block Tor Nodes"
PLG_SYSTEM_ADMINEXILE_TORNODES_DESC="Enable Tor node blocking to restrict access to your /administrator backend to any IP addresses identified as Tor nodes. This is useful for preventing brute force attacks from Tor nodes."